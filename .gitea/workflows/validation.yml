---
name: Validate definitions

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ci-untrusted-python312

    steps:
      - name: Check out the repository
        uses: https://git.nmulti.cloud/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: https://git.nmulti.cloud/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pip-audit==2.10.1
      - name: Audit dependencies
        run: pip-audit --progress-spinner off -r requirements.txt
      - name: Lint YAML files
        run: yamllint --format parsable --strict -c=tests/yamllint.yaml device-types/ module-types/
      - name: Run tests
        run: pytest --tb=short -v

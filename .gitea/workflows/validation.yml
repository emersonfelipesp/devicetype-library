---
name: Validate definitions

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ci-untrusted-python312

    steps:
      - name: Check out the repository
        uses: https://git.nmulti.cloud/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up pinned Python tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.28'
          python-version: '3.12.13'
          enable-cache: true
          cache-dependency-glob: requirements.txt
          cache-local-path: ${{ runner.temp }}/devicetype-uv-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          prune-cache: false
      - name: Create a private seeded Python environment
        run: |
          set -euo pipefail
          validation_venv="${RUNNER_TEMP}/devicetype-venv-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
          test ! -e "$validation_venv"
          test ! -L "$validation_venv"
          uv venv --python 3.12.13 --seed "$validation_venv"
          "$validation_venv/bin/python" --version
          printf '%s\n' "$validation_venv/bin" >> "$GITHUB_PATH"
          printf 'PIP_CACHE_DIR=%s\n' "${UV_CACHE_DIR}/pip" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pip-audit==2.10.1
      - name: Audit dependencies
        run: pip-audit --progress-spinner off -r requirements.txt
      - name: Lint YAML files
        run: yamllint --format parsable --strict -c=tests/yamllint.yaml device-types/ module-types/
      - name: Run tests
        run: pytest --tb=short -v
